<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clube dos Ventos Kite Fest</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe
      id="liveheats-frame"
      src="https://liveheats.com.br/events/553952"
      scrolling="yes"
      allowfullscreen
      title="Favela Surf Festival"
    ></iframe>
  </div>

  <script>
    const frame = document.getElementById('liveheats-frame');

    function hideButtons(doc) {
      try {
        const keywords = [
          'login', 'log in', 'entrar',
          'sign up', 'signup', 'cadastrar', 'criar conta', 'register',
          'for organisers', 'for organizers', 'organizadores', 'organiser', 'organizer'
        ];

        const elements = doc.querySelectorAll('a, button');
        elements.forEach(el => {
          const text = el.innerText?.toLowerCase().trim() || '';
          if (keywords.some(kw => text.includes(kw))) {
            el.style.setProperty('display', 'none', 'important');
          }
        });
      } catch(e) {}
    }

    function injectStyles(doc) {
      try {
        const existing = doc.getElementById('__hidden_styles__');
        if (existing) existing.remove();

        const style = doc.createElement('style');
        style.id = '__hidden_styles__';
        style.textContent = `
          a[href*="/login"],
          a[href*="/signup"],
          a[href*="/register"],
          a[href*="sign-in"],
          a[href*="sign-up"],
          a[href*="/organiser"],
          a[href*="/organizer"],
          a[href*="/dashboard"],
          a[href*="for-organisers"],
          a[href*="for-organizers"],
          nav a[href*="login"],
          nav a[href*="signup"],
          nav a[href*="sign-up"],
          nav a[href*="organis"],
          nav a[href*="organiz"] {
            display: none !important;
          }
        `;
        doc.head.appendChild(style);

        hideButtons(doc);

        // Reaplica quando o React re-renderizar elementos
        const observer = new MutationObserver(() => hideButtons(doc));
        observer.observe(doc.body, { childList: true, subtree: true });

      } catch (e) {
        console.warn('Cross-origin bloqueou acesso ao iframe:', e.message);
      }
    }

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument || frame.contentWindow.document;
        injectStyles(doc);
      } catch (e) {
        console.warn('Cross-origin bloqueou acesso ao iframe:', e.message);
      }
    });
  </script>
</body>
</html>
